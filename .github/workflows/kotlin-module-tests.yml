name: Push module unit tests
# Fork-only helper (not for upstream): runs the winglet-push Kotlin unit tests, which no upstream workflow runs.
on:
  workflow_dispatch:
  push:
    branches: [ci/kotlin-module-tests]
jobs:
  push-module:
    name: winglet-push unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WINGLET_DEV: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
        working-directory: app
      - run: npx expo prebuild --platform android --no-install
        working-directory: app
      - name: Kotlin unit tests for the push module
        working-directory: app/android
        run: ./gradlew :winglet-push:testReleaseUnitTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=768m' -Pkotlin.compiler.execution.strategy=in-process -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: push-module-test-results
          retention-days: 7
          path: app/android/modules/winglet-push/android/build/test-results/**/*.xml
