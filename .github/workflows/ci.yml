name: CI

on:
  push:
    branches: [main, integration/dev-all]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: Plugin tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # The tests read workflow and doc files that contain UTF-8; Windows defaults to cp1252 and cannot decode them.
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-aiohttp http_ece pyyaml packaging pillow
      - name: Install the plugin's declared dependencies
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, yaml
          manifest = yaml.safe_load(pathlib.Path('plugin/plugin.yaml').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *manifest['python_dependencies']])
          PY
      - run: pytest -q
      - name: Bundled web app is complete
        run: python scripts/check_web_bundle.py

  hermes:
    # The same tests against a real Hermes, so anything that goes through Hermes's own code (members'
    # tool limits run through its toolset resolver) is checked there too.
    name: Plugin tests with Hermes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          # The Hermes these tests were last checked against. Move it forward on purpose.
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19  # v0.23.0
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Hermes only supports editable installs. Its own pyproject overrides a Pillow pin that two of its
      # dependencies disagree about (see [tool.uv] there); plain pip ignores that, so install with uv.
      - run: |
          pip install uv
          echo "Pillow==13.0.0" > overrides.txt
          uv pip install --system --override overrides.txt -e ./hermes-agent pytest pytest-aiohttp http_ece pyyaml packaging
      - name: Install the plugin's declared dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, yaml
          manifest = yaml.safe_load(pathlib.Path('plugin/plugin.yaml').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *manifest['python_dependencies']])
          PY
      - name: Hermes is really there
        run: python -c "import gateway.run_turn, hermes_cli.tools_config"
      - run: pytest -q

  app:
    name: App typecheck + web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo export --platform web
      - name: Android bundle and Hermes bytecode
        run: npx expo export --platform android --output-dir dist-android
