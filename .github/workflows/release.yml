name: Release

# Push a tag like v0.1.0 to build the Android APK and the plugin bundle and attach them to a
# GitHub Release. PRs to main and manual runs build validation artifacts without publishing.
# A manual run can also build a test APK with the developer timing and/or R8 (see docs/RELEASING.md); a tag push or a
# pull request never can.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      timing:
        description: "Test build with the developer timing switched on (EXPO_PUBLIC_WINGLET_PERF=1). Not for release."
        type: boolean
        default: false
      r8:
        description: "Test build with R8 code shrinking switched on (WINGLET_MINIFY=1). Not for release."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  checks:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry check requires complete history. Use literal zero (numeric zero is falsy in expressions).
          fetch-depth: 0
      # Releases are cut from main (docs/RELEASING.md): a tag on any other commit publishes nothing.
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge the release pull request into main first, then tag main (docs/RELEASING.md)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No release without its documents: the release notes for this version and the README banner (docs/RELEASING.md).
      # Checked first because it is quick and says exactly which file to fix. A manual run publishes nothing, so it skips this.
      - name: Release documents (tag)
        if: github.ref_type == 'tag'
        run: python scripts/check_release_docs.py --tag "$GITHUB_REF_NAME"
      - name: Release documents (pull request to main)
        if: github.event_name == 'pull_request'
        run: python scripts/check_release_docs.py
      - run: pip install pytest pytest-aiohttp http_ece pyyaml packaging pillow
      - name: Install the plugin's declared dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, yaml
          manifest = yaml.safe_load(pathlib.Path('plugin/plugin.yaml').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *manifest['python_dependencies']])
          PY
      - run: pytest -q
      - run: python scripts/check_web_bundle.py
      # Only the tag publishes, so only the tag needs a rebuilt bundle. Pull requests and manual runs validate without it.
      - name: Committed web app matches the app source
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_web_bundle.py --fresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npx tsc --noEmit && npm test
        working-directory: app

  android:
    name: Android APK
    runs-on: ubuntu-latest
    # The Gradle release build (R8 plus lintVital) took 30 minutes cold and was killed by the old limit,
    # which cancelled the whole release. The cache below makes a warm run much faster, and this leaves room
    # for a cold one.
    timeout-minutes: 60
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      IS_INTERNAL_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: No timing or R8 outside a manual test run
        # A release, a tag, and a pull request must never carry the test switches. Ask for them on a tag (a manual run
        # started from a tag counts) or have them already in the environment, and the run stops here.
        if: github.event_name != 'workflow_dispatch' || github.ref_type == 'tag'
        env:
          ASKED_TIMING: ${{ inputs.timing }}
          ASKED_R8: ${{ inputs.r8 }}
        run: |
          if [ "$ASKED_TIMING" = "true" ] || [ "$ASKED_R8" = "true" ] || [ -n "${EXPO_PUBLIC_WINGLET_PERF:-}" ] || [ -n "${WINGLET_MINIFY:-}" ]; then
            echo "::error::Timing and R8 are only for manual test builds, never for a tag, a release or a pull request"; exit 1
          fi
      - name: Work out the version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]] || { echo "::error::Tags must look like v1.2.3 or v1.2.3-beta.1"; exit 1; }
            PLUGIN_VERSION="$(sed -n 's/^version: *//p' plugin/plugin.yaml | head -1)"
            [ "$PLUGIN_VERSION" = "${VERSION%%-*}" ] || { echo "::error::plugin/plugin.yaml says $PLUGIN_VERSION but the tag is $VERSION; bump the version first (docs/RELEASING.md)"; exit 1; }
            [ "$HAS_SIGNING_KEY" = "true" ] || { echo "::error::Releases need the signing key secrets (see docs/RELEASING.md)"; exit 1; }
            LABEL="$VERSION"
          else
            VERSION="$(node -p "require('./app/app.json').expo.version")"
            if [ "$IS_INTERNAL_PR" = "true" ] && [ "$HAS_SIGNING_KEY" != "true" ]; then
              echo "::error::Promotion PRs require the production signing key"; exit 1
            fi
            LABEL="dev-${GITHUB_SHA::7}"
            [ "$HAS_SIGNING_KEY" = "true" ] || LABEL="${LABEL}-debugkey"
          fi
          echo "WINGLET_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_LABEL=$LABEL" >> "$GITHUB_ENV"
      - name: Name a manual test build after its switches
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        env:
          ASKED_TIMING: ${{ inputs.timing }}
          ASKED_R8: ${{ inputs.r8 }}
        run: |
          SUFFIX=""
          [ "$ASKED_TIMING" = "true" ] && SUFFIX="${SUFFIX}-timing"
          [ "$ASKED_R8" = "true" ] && SUFFIX="${SUFFIX}-r8"
          echo "APK_LABEL=${APK_LABEL}${SUFFIX}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Load signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "WINGLET_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build release APKs
        working-directory: app/android
        env:
          WINGLET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WINGLET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WINGLET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # One APK per CPU instead of a universal one (app/plugins/withApkSplits.js).
          WINGLET_SPLIT_APKS: "1"
          # Test switches: on only for a manual run (not from a tag) that asked for them; empty otherwise, and empty is
          # off for both (app/src/lib/perf.ts and app/plugins/withMinify.js). Metro reads the first while Gradle bundles
          # the JavaScript, so this step is the right place for it.
          EXPO_PUBLIC_WINGLET_PERF: ${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' && inputs.timing && '1' || '' }}
          WINGLET_MINIFY: ${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' && inputs.r8 && '1' || '' }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Check the signatures
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          AAPT="${APKSIGNER%apksigner}aapt"
          # Public certificate of this fork's release key (upstream's v0.9.0 key is not ours). A different key would break installed-app upgrades.
          EXPECTED_CERT="48be2677740ba3ba5c2b93e0195906ebdcc3b7525cb32acbf86090807fa279ae"
          EXPECTED_CODE="$(node -e 'const [a,b,c]=process.env.WINGLET_VERSION.split("-")[0].split(".").map(Number); console.log(a*10000+b*100+c)')"
          for ABI in arm64-v8a armeabi-v7a; do
            APK="app/android/app/build/outputs/apk/release/app-${ABI}-release.apk"
            [ -f "$APK" ] || { echo "::error::Missing $APK"; ls app/android/app/build/outputs/apk/release; exit 1; }
            "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
            if [ "$HAS_SIGNING_KEY" = "true" ] && grep -q "CN=Android Debug" certs.txt; then
              echo "::error::Release APK is signed with the debug key"; exit 1
            fi
            if [ "$HAS_SIGNING_KEY" = "true" ]; then
              CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' certs.txt | sort -u)"
              [ "$CERT" = "$EXPECTED_CERT" ] || { echo "::error::Signing certificate differs from the installed production app"; exit 1; }
            fi
            "$AAPT" dump badging "$APK" > badging.txt
            head -1 badging.txt > package.txt
            grep -Fq "package: name='io.github.vikasrp24.winglet'" package.txt
            grep -Fq "versionName='$WINGLET_VERSION'" package.txt
            grep -Fq "versionCode='$EXPECTED_CODE'" package.txt
          done
      - name: Rename APKs
        run: |
          mkdir -p out
          for ABI in arm64-v8a armeabi-v7a; do
            cp "app/android/app/build/outputs/apk/release/app-${ABI}-release.apk" "out/winglet-${APK_LABEL}-${ABI}.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: winglet-apk
          path: out/*.apk

  plugin:
    name: Plugin bundle (with web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build web app into plugin/web
        run: ./scripts/build-web.sh
      - name: Zip plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p out
          cp -r plugin winglet
          zip -qr "out/winglet-plugin-${VERSION}.zip" winglet -x 'winglet/__pycache__/*'
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: winglet-plugin
          path: out/*.zip

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [checks, android, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - name: Release notes
        run: |
          # docs/releases/<tag>.md, when there is one, goes above GitHub's list of merged PRs.
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { NOTES="$RUNNER_TEMP/notes.md"; : > "$NOTES"; }
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Winglet ${{ github.ref_name }}
          files: out/*
          body_path: ${{ env.NOTES }}
          generate_release_notes: true
          # v1.2.3-beta.1 and v1.2.3-rc.1 are pre-releases; "latest" stays on the last full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
